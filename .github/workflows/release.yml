name: Release

# 打 tag（v*）即发布：构建 sdist+wheel + 离线部署包，作为 GitHub Release 资产上传。
# 用户安装：pip install <release 里的 .whl 链接>，或 pipx install git+https://github.com/Hector-xue/ivyea-agent.git
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 / 更新 GitHub Release

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tag 和源码里的版本号必须一致。
      #
      # 这个坑这个仓库踩过两次：一次是 1e2cb0f「单一版本源，根治 __version__
      # 漂移导致的"永远有更新"」，一次是 v1.10.0 —— 打 tag 时忘了 bump
      # ivyea_agent/__init__.py，结果发行包里的代码是新的、自报家门是旧的。
      #
      # 后果不是"版本号不好看"：IvyeaOps 读 `ivyea --version` 拿到旧号，
      # 和 GitHub 最新 Release 一比就认为有更新 —— **那个"有更新"徽标会一直
      # 亮着，用户更新多少次都消不掉**，因为装上去之后自报的还是旧号。
      #
      # 放在 release 而不是 CI：只有打 tag 这一刻才知道 tag 名。
      # 它拦不住 tag 被创建，但能拦住带着错版本号的 Release 发出去。
      - name: 版本号必须与 tag 一致
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(python -c "import ivyea_agent, sys; sys.stdout.write(ivyea_agent.__version__)")
          echo "tag=$TAG  __version__=$VER"
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::tag $TAG 与 ivyea_agent.__version__ ($VER) 不一致。"
            echo "::error::打 tag 前要先改 ivyea_agent/__init__.py 的 __version__ 并提交。"
            exit 1
          fi

      - name: 从 CHANGELOG 取本版说明
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          # 取 `## [vX.Y.Z]` 到下一个 `## [` 之间那一段。**取不到就让发版失败**：
          # 一个没有"新增了什么、修复了什么"的 Release，对使用者等于没发。
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > CHANGELOG_SECTION.md
          if [ ! -s CHANGELOG_SECTION.md ]; then
            echo "::error::CHANGELOG.md 里没有 $TAG 这一节。发版前要把 Unreleased 改成本版号。"
            exit 1
          fi
          echo "取到 $(wc -l < CHANGELOG_SECTION.md) 行版本说明"

      - name: Build sdist + wheel
        run: python -m pip install --upgrade build && python -m build
      - name: Build offline installer bundles
        run: python scripts/build_offline_bundle.py
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # body_path = CHANGELOG 里本版那一节；generate_release_notes 生成的
          # commit 列表接在它后面。两者互补：一个说"改了什么、为什么"，
          # 另一个说"由哪些提交组成"。
          body_path: CHANGELOG_SECTION.md
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/offline/*.zip
            dist/offline/*.tar.gz
