[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivyea-agent"
# Single-sourced from ivyea_agent.__version__ (see [tool.setuptools.dynamic]) so
# a version bump only ever touches ivyea_agent/__init__.py and can't drift.
dynamic = ["version"]
description = "Ivyea Agent — 自托管的亚马逊运营 CLI Agent（对话式 + 多模型 + 领星广告读写审批 + 通用工具 + 记忆）"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Hector" }]
keywords = ["amazon", "advertising", "agent", "cli", "llm", "deepseek", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "pandas>=2.0",
    # 自带语义检索（static_embedding）的查表运算靠它。pandas 本来就会拖进来，
    # 但那是**传递依赖**——显式写出来才是契约，否则哪天 pandas 换了依赖就静默失效。
    "numpy>=1.21",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "Pygments>=2.17",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://agent.ivyea.com"
Repository = "https://github.com/Hector-xue/ivyea-agent"
Documentation = "https://agent.ivyea.com/docs.html"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]
anthropic = ["anthropic>=0.69"]
semantic = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 真跑构建/模型的重测试，默认可用 -m 'not slow' 跳过"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["ivyea_agent/rule_engine_scripts", "build"]  # vendored 第三方脚本不按本仓风格

[tool.ruff.lint]
# 务实：放过长行/裸 except/分号一行(conn.commit();close() 的刻意紧凑)，主抓真错(未用导入/未定义名)
#
# select 必须显式写死，不能吃 ruff 的默认值：默认集是会随版本变的。0.16.0 就把
# flake8-pie / refurb 等风格规则纳入默认，一次没改过代码的推送凭空多出 421 条
# （re.M 建议写成 re.MULTILINE 之类），CI 一夜变红。写死之后规则只由本文件决定。
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E722", "E741", "E702"]

[project.scripts]
ivyea = "ivyea_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ivyea_agent.__version__" }

[tool.setuptools.packages.find]
include = ["ivyea_agent*"]
namespaces = true

[tool.setuptools.package-data]
"ivyea_agent.rule_engine_scripts" = ["*.csv"]
# data/static_embedding.npz 是"装完就有语义检索"的全部依赖（约 4.5MB 的 int8 查表）。
# 漏进 wheel 的话不会报错，只会静默退回词法检索——tests/test_packaging.py 盯着这件事。
"ivyea_agent" = ["knowledge_base/*.json", "knowledge_base/**/*.md", "skills_builtin/**/*.json", "skills_builtin/**/*.md", "data/*.npz", "data/*.json"]
