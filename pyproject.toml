[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivyea-agent"
# Single-sourced from ivyea_agent.__version__ (see [tool.setuptools.dynamic]) so
# a version bump only ever touches ivyea_agent/__init__.py and can't drift.
dynamic = ["version"]
description = "Ivyea Agent — 自托管的亚马逊运营 CLI Agent（对话式 + 多模型 + 领星广告读写审批 + 通用工具 + 记忆）"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Hector" }]
license = { text = "MIT" }
keywords = ["amazon", "advertising", "agent", "cli", "llm", "deepseek", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "pandas>=2.0",
    # 自带语义检索（onnx_embedding）要用。pandas 本来就会拖进来，但那是**传递依赖**——
    # 显式写出来才是契约，否则哪天 pandas 换了依赖就静默失效。
    "numpy>=1.21",
    # 随包的 bge-small-zh（ONNX int8，24MB）靠它跑，这是"装完就有语义检索"的前提。
    # 纯 CPU 轮子约 19MB，Linux/Windows/macOS 都有——**刻意不是 torch**：
    # pip 默认会给 Linux 拉 GB 级的 CUDA 版，小内存机器直接被 OOM 杀掉。
    "onnxruntime>=1.16",
    # T3 本地视觉（local_vision）的图像解码。纯 wheel、约 3MB，各平台都有。
    "Pillow>=10.0",
    # T3 的 OCR 引擎（PP-OCR 系模型的 ONNX 封装，模型内置在 wheel 里，中英电商图
    # 明显强于 tesseract）。onnxruntime 上面已经有了，这里主要多出 opencv-python。
    #
    # **精简 Linux 镜像的坑**：opencv-python 依赖 libGL.so.1，slim/alpine 基础镜像
    # 默认没有，`import cv2` 会直接抛。ocr.py 的引擎探测是**运行时**做的，抛了会
    # 自动落到 tesseract、再落到"无 OCR"，T3 的几何/色彩度量不受影响。要修就装
    # 系统包 mesa-libGL（RHEL 系）/ libgl1（Debian 系）。
    "rapidocr-onnxruntime>=1.4",
    "openpyxl>=3.1",
    # 技能的 SKILL.md frontmatter 用它解析。业界通行的技能格式（Anthropic Agent
    # Skills / Claude Code）就是 Markdown + YAML frontmatter，要认这个格式就绕不开
    # 一个 YAML 解析器。**不手写**：这些 description 里有冒号、中文标点和引号，
    # 手写解析器在这种输入上错得很安静。加载器对它缺失是容错的（跳过 frontmatter
    # 技能而不是整个崩掉），所以老环境升级上来也不会炸。
    "PyYAML>=5.4",
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "Pygments>=2.17",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://agent.ivyea.com"
Repository = "https://github.com/Hector-xue/ivyea-agent"
Documentation = "https://agent.ivyea.com/docs.html"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]
anthropic = ["anthropic>=0.69"]
semantic = ["sentence-transformers>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 真跑构建/模型的重测试，默认可用 -m 'not slow' 跳过"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["ivyea_agent/rule_engine_scripts", "build"]  # vendored 第三方脚本不按本仓风格

[tool.ruff.lint]
# 务实：放过长行/裸 except/分号一行(conn.commit();close() 的刻意紧凑)，主抓真错(未用导入/未定义名)
#
# select 必须显式写死，不能吃 ruff 的默认值：默认集是会随版本变的。0.16.0 就把
# flake8-pie / refurb 等风格规则纳入默认，一次没改过代码的推送凭空多出 421 条
# （re.M 建议写成 re.MULTILINE 之类），CI 一夜变红。写死之后规则只由本文件决定。
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E722", "E741", "E702"]

[project.scripts]
ivyea = "ivyea_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ivyea_agent.__version__" }

[tool.setuptools.packages.find]
include = ["ivyea_agent*"]
namespaces = true

[tool.setuptools.package-data]
"ivyea_agent.rule_engine_scripts" = ["*.csv"]
# data/embedding_int8.onnx + 词表是"装完就有语义检索"的全部依赖（约 24MB）。
# 漏进 wheel 的话不会报错，只会静默退回词法检索——tests/test_packaging_builtin_model.py 盯着这件事。
"ivyea_agent" = ["knowledge_base/*.json", "knowledge_base/**/*.md", "skills_builtin/**/*.json", "skills_builtin/**/*.md", "data/*.onnx", "data/*.json", "data/*.txt"]
